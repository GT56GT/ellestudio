name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway database so the Postgres store, owners, chats and metrics
    # tests run for real.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ellie
          POSTGRES_PASSWORD: ellie
          POSTGRES_DB: ellie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ellie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://ellie:ellie@localhost:5432/ellie_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests (race detector, with Postgres)
        # -p 1: the Postgres tests of internal/store and internal/admin share
        # the same tables, so packages run one at a time.
        run: go test -race -count=1 -p 1 ./...

  admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Type-check and build the admin UI
        working-directory: admin-ui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the admin panel with the UI embedded
        run: go build -tags embedui -o /dev/null ./cmd/ellie-admin
